[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-exam-exchange"
version = "1.0.0"
description = "Authenticated hybrid encryption for examination-paper exchange"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
secure-exam = "secure_exam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
